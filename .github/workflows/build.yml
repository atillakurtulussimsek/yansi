name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: APK derle
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ayna-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        working-directory: mac
        run: swift build -c release
      - name: Paketle
        run: |
          mkdir -p out
          cp mac/.build/release/ayna-mac out/
          cd out && tar czf ayna-mac.tar.gz ayna-mac
      - uses: actions/upload-artifact@v4
        with:
          name: ayna-mac
          path: out/ayna-mac.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yapılandır
        run: cmake -S windows -B build -A x64
      - name: Derle
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ayna-win
          path: build/Release/ayna-win.exe
