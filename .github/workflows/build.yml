name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: APK derle
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yansi-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        working-directory: mac
        run: swift build -c release
      - name: Paketle
        run: |
          mkdir -p out
          cp mac/.build/release/yansi-mac out/
          cd out && tar czf yansi-mac.tar.gz yansi-mac
      - uses: actions/upload-artifact@v4
        with:
          name: yansi-mac
          path: out/yansi-mac.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yapılandır
        run: cmake -S windows -B build -A x64
      - name: Derle
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: yansi-win
          path: build/Release/yansi-win.exe

  release:
    # Yalnızca v* etiketi itildiğinde: üç çıktıyı Releases sayfasına koy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Dosyaları adlandır
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir -p release
          cp dist/yansi-android/app-debug.apk "release/yansi-android-${V}.apk"
          cp dist/yansi-mac/yansi-mac.tar.gz "release/yansi-mac-${V}.tar.gz"
          cp dist/yansi-win/yansi-win.exe "release/yansi-win-${V}.exe"
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
